name: Marriage app

on:
  push:
    paths: ["marriage-app/**", ".github/workflows/marriage-app.yml"]
  pull_request:
    paths: ["marriage-app/**", ".github/workflows/marriage-app.yml"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: marriage-app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4

      - name: Test and build debug APK
        run: ./gradlew :engine:test :app:testDebugUnitTest :app:assembleDebug

      # Signed release, only when the signing secrets are set in the repository settings.
      - name: Build signed release APK
        env:
          KEYSTORE_BASE64: ${{ secrets.MARRIAGE_KEYSTORE_BASE64 }}
          MARRIAGE_KEYSTORE_PASSWORD: ${{ secrets.MARRIAGE_KEYSTORE_PASSWORD }}
          MARRIAGE_KEY_ALIAS: ${{ secrets.MARRIAGE_KEY_ALIAS }}
          MARRIAGE_KEY_PASSWORD: ${{ secrets.MARRIAGE_KEY_PASSWORD }}
        if: env.KEYSTORE_BASE64 != ''
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > release.jks
          MARRIAGE_KEYSTORE=release.jks ./gradlew :app:assembleRelease :app:bundleRelease
          rm release.jks

      - uses: actions/upload-artifact@v4
        with:
          name: marriage-apks
          path: |
            marriage-app/app/build/outputs/apk/**/*.apk
            marriage-app/app/build/outputs/bundle/release/*.aab
            marriage-app/app/build/screenshots/*.png
          if-no-files-found: ignore
